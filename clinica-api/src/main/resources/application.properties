quarkus.http.root-path=/
quarkus.datasource.db-kind=${CLINICA_DB_KIND:h2}
quarkus.datasource.jdbc.url=${CLINICA_DB_URL:jdbc:h2:file:./data/clinica;DB_CLOSE_ON_EXIT=FALSE}
quarkus.datasource.username=${CLINICA_DB_USERNAME:sa}
quarkus.datasource.password=${CLINICA_DB_PASSWORD:}
quarkus.flyway.locations=classpath:db/migration/${quarkus.datasource.db-kind}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1
quarkus.flyway.clean-disabled=true
quarkus.hibernate-orm.database.generation=${CLINICA_SCHEMA_GENERATION:validate}
quarkus.hibernate-orm.log.sql=false
quarkus.http.port=8080
quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:1025}
quarkus.mailer.username=${SMTP_USERNAME:}
quarkus.mailer.password=${SMTP_PASSWORD:}
quarkus.mailer.ssl=${SMTP_SSL:false}
quarkus.mailer.mock=false
clinica.mail.from=${CLINICA_MAIL_FROM:noreply@clinica.local}
clinica.bootstrap.admin.email=${CLINICA_ADMIN_EMAIL:}
clinica.bootstrap.admin.password=${CLINICA_ADMIN_PASSWORD:}
clinica.password-reset.url=${CLINICA_PASSWORD_RESET_URL:http://localhost:3000/reset-password}
clinica.inventory.minimum-stock=${CLINICA_MINIMUM_STOCK:10}
